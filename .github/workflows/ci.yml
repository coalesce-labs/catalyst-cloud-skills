name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.derive.outputs.node }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      # CTC-2158 / Ryan 2026-09-17: "current plus active LTS, matrix derived from engines". The list
      # is DERIVED here, never hand-written — raising engines.node is the only edit that changes it.
      - id: derive
        run: echo "node=$(node scripts/node-support-matrix.mjs --json)" >> "$GITHUB_OUTPUT"

  check:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.matrix.outputs.node) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install (frozen)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # ⛔ The suite itself CANNOT see this. Measured 2026-09-17: inside `bun run test`,
      # process.execPath is the real node setup-node installed and process.versions.bun is ABSENT,
      # because vitest's bin carries `#!/usr/bin/env node` and `bun run` delegates to it. Every test
      # that spawns the built CLI uses process.execPath, so the Node the CLI runs under is the Node
      # vitest runs under — never a second major. This step is the only thing that runs the built CLI
      # on THIS matrix major, which is the exact regression Tony hit on Node 26.
      - name: The built CLI loads the SDK on Node ${{ matrix.node }}
        run: |
          set -euo pipefail
          out="$(node bin/catalyst-skills.js ready || true)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q '^ok .*sdk: loads' \
            || { echo "::error title=SDK did not load on Node ${{ matrix.node }}::$out"; exit 1; }

  bun-runtime:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.3.14 has no node:sqlite (measured: `bun -e 'import "node:sqlite"'` -> could not resolve);
        # latest has it. Both directions are asserted, because the FAILING one is what a customer hits.
        include:
          - bun: 1.3.14
            expect: friendly-refusal
          - bun: latest
            expect: sdk-loads
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: The built CLI under bun ${{ matrix.bun }} (${{ matrix.expect }})
        run: |
          set -euo pipefail
          out="$(bun bin/catalyst-skills.js ready 2>&1 || true)"
          printf '%s\n' "$out"
          case "${{ matrix.expect }}" in
            sdk-loads)
              printf '%s\n' "$out" | grep -q '^ok .*sdk: loads' ;;
            friendly-refusal)
              # It must name bun, name the floor, print the one command — and NEVER leak the raw
              # ResolveMessage the launcher used to print before CTC-2158.
              printf '%s\n' "$out" | grep -q 'bun 1\.3\.14' \
                && printf '%s\n' "$out" | grep -q 'runtime install' \
                && ! printf '%s\n' "$out" | grep -q 'ResolveMessage' ;;
          esac

  # CTC-2534 — tell catalyst-cloud that the bundle moved, so its vendored `.well-known` index stops
  # lagging. It lagged 27 commits and a whole skill (`unstick`) before this existed, and served a
  # `connect-me` description naming the WRONG KEY TIER — copy that is actively wrong rather than
  # merely absent, and cannot self-heal.
  #
  # ⛔ WHY HERE AND NOT IN publish.yml. catalyst-cloud's sync reads this repo's DEFAULT BRANCH HEAD
  # (`sync-skills-bundle-manifest.ts` resolves `default_branch` then takes `head.sha`), so drift is
  # created by pushes to main. `publish.yml` runs on TAGS only, so a sender there would miss every
  # main push between releases — which is exactly the window the index has been lagging in. The
  # deferred-trigger comment in catalyst-cloud names "the bundle repo's own publish workflow"; that
  # is the right repo and the wrong workflow, and this is the difference.
  notify-catalyst-cloud:
    name: Tell catalyst-cloud the bundle moved
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # ⛔ WARNS LOUDLY, NEVER FAILS OPEN SILENTLY. The dispatch token is a cross-repo credential
      # that does not exist yet — `github.token` is scoped to THIS repo and cannot fire a
      # repository_dispatch at catalyst-cloud. Until a human mints it, this step says so on every
      # main push rather than reporting success and re-hiding the drift. A missing secret is a
      # visible gap; a swallowed one is the same silence this job exists to end.
      - name: Dispatch skills-bundle-published
        env:
          DISPATCH_TOKEN: ${{ secrets.CATALYST_CLOUD_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::warning title=skills-bundle sync not wired::CATALYST_CLOUD_DISPATCH_TOKEN is not set, so catalyst-cloud was NOT told the bundle moved. Its .well-known index will lag until someone runs 'bun run skills-bundle:sync' by hand. Mint a token with repository_dispatch rights on coalesce-labs/catalyst-cloud and add it as this repo's CATALYST_CLOUD_DISPATCH_TOKEN."
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/coalesce-labs/catalyst-cloud/dispatches \
            -d '{"event_type":"skills-bundle-published"}')
          if [ "$code" != "204" ]; then
            echo "::error title=skills-bundle dispatch failed::GitHub answered ${code}; catalyst-cloud was not told the bundle moved."
            cat /tmp/dispatch.out
            exit 1
          fi
          echo "::notice::dispatched skills-bundle-published to coalesce-labs/catalyst-cloud"
