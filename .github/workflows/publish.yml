# CTC-1949: publish the CLI to npm from a tag, never from a laptop. Since CTC-3479 that is two
# packages at one version: @catalyst-cloud/cli, and @catalyst-cloud/catalyst-skills as a forwarder
# that depends on it, so machines still updating the old name get the same release. This
# repository is the package's one home (moved out of the catalyst-cloud monorepo's
# packages/skill-bundle, which is the same source this workflow ran against there). The whole test
# suite runs FIRST, and it carries the pack-and-install smoke (pack the real tarball, install into a
# clean directory, run the installed login against a fixture /me server) — a broken publish cannot ship. Publishing credentials live as the repository secret
# NPM_PUBLISH_TOKEN (an npm automation token with publish rights on the @catalyst-cloud scope). A
# workflow_dispatch run publishes with --dry-run by default so the whole path can be rehearsed
# before the first real tag.
name: skills-bundle publish

on:
  push:
    tags:
      - "skills-bundle-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rehearse the publish with npm --dry-run (no upload, secret still required).
        required: false
        type: boolean
        default: true

concurrency:
  group: skills-bundle-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install (frozen)
        run: bun install --frozen-lockfile

      - name: Test suite with coverage, including the pack-and-install smoke
        run: bun run test:coverage

      - uses: astral-sh/setup-uv@v7

      # CTC-2012 Tier 1b — "given a publish, when skill-scanner runs over skills/, then no finding
      # blocks it": this is that gate, literally on the publish path, before npm publish below.
      - name: Skill scanner over skills/
        run: bun run skills:scan

      # ⛔ WARNS LOUDLY, NEVER FAILS OPEN SILENTLY — same pattern as ci.yml's evals job. On the
      # publish path there is no prior diff to filter by relevance: every publish runs the scored
      # suite when the secrets exist, and says so plainly when they do not, because "this release
      # shipped with no scored routing check" is exactly the fact a reader of this log needs.
      - name: Install the Claude Code CLI
        run: bun add -g @anthropic-ai/claude-code

      - name: Run the scored eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_FOR_EVALS }}
          CLAUDE_CODE_WALNUT_SPIRE: ${{ secrets.CLAUDE_CODE_PLUGIN_EVAL_ENABLEMENT }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ] || [ -z "${CLAUDE_CODE_WALNUT_SPIRE:-}" ]; then
            echo "::warning title=skill evals not wired::This release is publishing with NO scored routing check. ANTHROPIC_API_KEY_FOR_EVALS and/or CLAUDE_CODE_PLUGIN_EVAL_ENABLEMENT are unset. The deterministic half (test/evals-suite.test.ts, run above via test:coverage) still holds every description to its cases. Add both secrets to close this gap."
            exit 0
          fi
          bun run evals

      - name: Tag must name the version being published
        if: github.event_name == 'push'
        run: |
          pkg_version="$(node -p 'require("./package.json").version')"
          tag_version="${GITHUB_REF_NAME#skills-bundle-v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "tag skills-bundle-v$tag_version does not match package version $pkg_version" >&2
            exit 1
          fi

      # CTC-3479 — both packages ship at one version, and the forwarder pins exactly that version of
      # @catalyst-cloud/cli. `npm run version:sync` keeps them equal; this refuses a release that drifted.
      - name: Both packages carry one version
        run: node scripts/sync-plugin-version.mjs --check

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org

      # CTC-3479 — two packages, one version. @catalyst-cloud/cli (this directory) goes first, because
      # the forwarder @catalyst-cloud/catalyst-skills (packages/catalyst-skills) depends on exactly its
      # version, and the CLI's `ready` compares against the forwarder's `latest`. A version that is
      # already on npm is skipped, so re-running a release whose second publish failed finishes it
      # instead of failing on the first.
      - name: npm publish @catalyst-cloud/cli, then the @catalyst-cloud/catalyst-skills forwarder
        run: |
          set -euo pipefail
          dry=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            dry="--dry-run"
          fi
          for dir in . packages/catalyst-skills; do
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if [ -z "$dry" ] && [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "$name@$version is already on npm; skipping"
              continue
            fi
            # prepack builds dist for the CLI; the files gate ships bin/dist/skills/README/CHANGELOG/LICENSE.
            (cd "$dir" && npm publish --access public $dry)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
